<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารงาน กยศ. มหาวิทยาลัยอุบลราชธานี</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .landing-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .btn-enter {
            display: inline-block;
            background: linear-gradient(135deg, #1976D2 0%, #1565c0 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.3);
            transition: all 0.3s ease;
        }
        .btn-enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(25, 118, 210, 0.4);
        }
    </style>
</head>
<body>
    <div class="landing-card">
        <img src="https://img1.pic.in.th/images/Ubu_logo.png" alt="UBU Logo" style="width: 100px; margin-bottom: 20px;">
        <h2 style="color: #333; margin-top: 0;">ระบบบริหารงาน กยศ.</h2>
        <h3 style="color: #666; font-weight: normal;">มหาวิทยาลัยอุบลราชธานี</h3>
        <p style="color: #888; margin-bottom: 30px;">
            กรุณาคลิกปุ่มด้านล่างเพื่อเข้าสู่ระบบ<br>(ระบบจะเปิดในหน้าต่างใหม่เพื่อความปลอดภัย)
        </p>
        
        <a href="https://script.google.com/macros/s/AKfycbwqjVfXhsYTam3mVPjEaxZTr_0kC1LG1yazYhr90tKibmDA0aNhLhtKwXLRv6GA1XA/exec" target="_blank" class="btn-enter">
            เข้าสู่ระบบ
        </a>
    </div>
</body>
</html>
