name: Run My Python Bot

# ตั้งค่าว่าให้บอททำงานตอนไหน
on:
  schedule:
    # ทำงานทุกๆ วันเวลา 00:00 UTC (07:00 น. เวลาไทย)
    # ดูวิธีกำหนดเวลาเพิ่มเติมได้ที่ crontab.guru
    - cron: '0 0 * * *'
  
  # ทำให้เราสามารถกดปุ่ม "Run workflow" รันบอทเองด้วยมือได้
  workflow_dispatch: 

jobs:
  build-and-run:
    runs-on: ubuntu-latest # ใช้เซิร์ฟเวอร์ Ubuntu ของ GitHub

    steps:
      - name: ดึงข้อมูลโค้ดจาก Repository
        uses: actions/checkout@v3

      - name: ตั้งค่า Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # เปลี่ยนเวอร์ชันได้ตามต้องการ

      - name: ติดตั้งไลบรารี
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: รันบอท
        env:
          # ดึงค่า Secret จาก GitHub มาใช้งานในโค้ด (ถ้ามี)
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }} 
        run: python bot.py
